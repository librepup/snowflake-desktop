# --- Fonts ---
font_family Source Code Pro for Powerline
active_tab_font_style bold
inactive_tab_font_style normal
font_size 14
font_style normal
modify_font cell_width 110%

# --- Cursor ---
cursor #f5e8d5
cursor_shape beam
cursor_beam_thickness 1.54
cursor_blink_interval 0
cursor_trail 200

# --- General ---
scrollback_lines -1
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier 10
enable_audio_bell no
bell_on_tab ""
notify_on_cmd_finish invisible 20
background_opacity 0.85

# --- Window Layout ---
remember_window_size no
initial_window_width 866
initial_window_height 432
window_padding_width 3
confirm_os_window_close 0

# --- Colors ---
foreground #ff3271
background #0a0a05
cursor #ec8a8f
color0 #f4788a
color1 #d58bb6
color2 #f87d73
color3 #f97c86
color4 #fc8083
color5 #f97c89
color6 #f87577
color7 #ec8a8f
color8 #f4788a
color9 #d58bb6
color10 #f87d73
color11 #f97c86
color12 #fc8083
color13 #f97c89
color14 #f87577
color15 #ec8a8f
# Tabs
active_tab_foreground    #FFFFFF
active_tab_background    #ff3271
inactive_tab_foreground  #ec8a8f
inactive_tab_background  #0a0a05

# --- Tab Bar ---
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style angled
tab_separator ""
tab_bar_margin_width 0.0
tab_bar_margin_height 0.0 0.0
tab_activity_symbol ""
tab_title_max_length 0
tab_bar_align left
tab_bar_show_new_tab_button no
tab_title_template "{fmt.fg._c08a96}{fmt.bg._0a0a05}{activity_symbol}{bell_symbol}{sup.index}{tab.active_exe}{fmt.fg._0a0a05}{fmt.bg._0a0a05}"
active_tab_title_template "{fmt.fg._0a0a05}{fmt.bg._ff3271}{sup.index}{tab.active_exe}{fmt.fg._c08a96}{fmt.bg._ff3271}{fmt.bg._ff3271}"

# --- Keyboard Shortcuts ---
clear_all_shortcuts yes
kitty_mod ctrl+shift
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+q quit
map ctrl+w>ctrl+h debug_config
map ctrl+w>h debug_config
map ctrl+shift+a>ctrl+h debug_config
map ctrl+shift+a>h debug_config
map ctrl+shift+e show_kitty_env_vars
map ctrl+shift+r load_config_file
map ctrl+shift+d debug_config
map ctrl+a send_text all \x01
map ctrl+e send_text all \x05
map ctrl+left send_text all \x1b\x62
map ctrl+right send_text all \x1b\x66
map ctrl+backspace send_text all \x17
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9
map ctrl+tab next_tab
map ctrl+w>tab next_tab
map ctrl+w>ctrl+tab next_tab
map ctrl+shift+a>tab next_tab
map ctrl+shift+a>ctrl+tab next_tab
map ctrl+shift+tab previous_tab
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+page_up move_tab_backward
map ctrl+shift+page_down move_tab_forward
map ctrl+l combine : clear_terminal scroll active : send_text all \x15
map ctrl+shift+l send_text normal,application l\r
map ctrl+o send_text normal,application sh -c 'file=$(kitten choose-files); [ -n "$file" ] && kitty @ send-text --match id:$KITTY_WINDOW_ID "$file"; clear'\r
map ctrl+w>ctrl+up scroll_line_up
map ctrl+w>ctrl+down scroll_line_down
map ctrl+shift+a>ctrl+up scroll_line_up
map ctrl+shift+a>ctrl+down scroll_line_down
map ctrl+shift+h show_scrollback
map ctrl+page_up scroll_home
map ctrl+page_down scroll_end
map ctrl+shift+i kitten unicode_input --tab name
map ctrl+w>f1 show_kitty_doc overview
map ctrl+shift+a>f1 show_kitty_doc overview
map ctrl+shift+space next_layout
map ctrl+w>n new_window
map ctrl+shift+a>n new_window
map ctrl+3 new_window
map shift+escape new_window
map ctrl+w>c close_window
map ctrl+0 close_window
map ctrl+shift+a>c close_window
map ctrl+shift+escape close_window
map ctrl+[ layout_action decrease_num_full_size_windows
map ctrl+] layout_action increase_num_full_size_windows
map ctrl+period layout_action decrease_num_full_size_windows
map ctrl+comma layout_action increase_num_full_size_windows
map ctrl+grave>up neighboring_window left
map ctrl+grave>do wnneighboring_window right
map ctrl+grave>up neighboring_window up
map ctrl+grave>do wnneighboring_window down
map f1 neighboring_window left
map f2 neighboring_window down
map f3 neighboring_window up
map f4 neighboring_window right
map ctrl+w>left neighboring_window left
map ctrl+w>right neighboring_window right
map ctrl+w>up neighboring_window up
map ctrl+w>down neighboring_window down
map ctrl+shift+a>left neighboring_window left
map ctrl+shift+a>right neighboring_window right
map ctrl+shift+a>up neighboring_window up
map ctrl+shift+a>down neighboring_window down
map shift+f1 move_window left
map shift+f2 move_window down
map shift+f3 move_window up
map shift+f4 move_window right
map ctrl+w>ctrl+shift+up move_window up
map ctrl+w>ctrl+shift+left move_window left
map ctrl+w>ctrl+shift+right move_window right
map ctrl+w>ctrl+shift+down move_window down
map ctrl+shift+a>ctrl+shift+up move_window up
map ctrl+shift+a>ctrl+shift+left move_window left
map ctrl+shift+a>ctrl+shift+right move_window right
map ctrl+shift+a>ctrl+shift+down move_window down
map ctrl+shift+right resize_window narrower
map ctrl+shift+left resize_window wider
map ctrl+shift+up resize_window taller
map ctrl+shift+down resize_window shorter 3
map ctrl+w>home resize_window reset
map ctrl+shift+a>home resize_window reset
map f5 resize_window narrower
map f6 resize_window wider
map f7 resize_window taller
map f8 resize_window shorter 3
map ctrl+w>x close_other_windows_in_tab
map ctrl+shift+a>x close_other_windows_in_tab
map ctrl+shift+a>f11 toggle_fullscreen
map ctrl+w>f11 toggle_fullscreen
map ctrl+q exit
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backslash change_font_size all 0
map ctrl+w>equal change_font_size all +1.0
map ctrl+w>minus change_font_size all -1.0
map ctrl+w>backslash change_font_size all 0
map ctrl+shift+a>equal change_font_size all +1.0
map ctrl+shift+a>minus change_font_size all -1.0
map ctrl+shift+a>backslash change_font_size all 0
map ctrl+/ combine : launch --stdin-source=@screen_scrollback --stdin-add-formatting --type=overlay less --no-edit-warn : send_key /
map ctrl+shift+m combine : launch --cwd=current --hold --type=tab "unshare -n --map-current-user mpv --profile=sw-fast --really-quiet --loop-playlist=inf --loop-file=inf @selection"
map --when-focus-on title:nixmacs ctrl+backspace send_key ctrl+backspace

# --- Custom Directives ---
include ~/.config/kitty/user.conf
