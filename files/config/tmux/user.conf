# set  -g default-terminal  "tmux"
set  -g default-terminal "screen"
set  -g base-index        0
setw -g pane-base-index   0
set  -g history-limit     2000
set  -g status-keys       emacs
set  -g mode-keys         emacs
setw -g aggressive-resize off
setw -g clock-mode-style  24
set  -s escape-time       500
set  -a terminal-features 'xterm-256color:RGB'
set-option -g default-shell /run/current-system/sw/bin/zsh

# Statusbar
set -g status-left-length 32
set -g status-right-length 150
set -g status-fg "#ec3372"
set -g status-bg "#0a0a05"
set -g status-left '#[fg="#ec3372",bg="#0a0a05",bold] [#S] #[fg="#ec3372",bg="#0a0a05",nobold][#[fg="#ec3372",bg="#0a0a05",bold] %H:%M #[fg="#ec3372",bg="#0a0a05",nobold]]'
set -g status-right '[#[fg="#ec3372"]󰭨 %d.%m.%Y]'
set -g window-status-format '#[fg="#ec3372",bg="#0a0a05"][#I:#W]'
set -g window-status-current-format '#[fg="#ec3372",bg="#0a0a05"]#[fg="#ec3372"bg="#0a0a05"noreverse,bold][#I:#W]#[fg="#ec3372"bg="#0a0a05",nobold]'
set -g window-status-style 'bg=#ec3372,fg=#0a0a05,fill=#ec3372,set-default'
set -g window-status-current-style 'fg=#ec3372,bg=#0a0a05,fill=#0a0a05,set-default'
set -g window-status-activity-style 'fg=#ec3372,bg=#0a0a05,fill=#0a0a05,set-default'
set -g status-style 'fg=#ec3372,bg=#0a0a05,bright,bold,noattr,noreverse,set-default'

# Prefix
set-option -g prefix C-b
set-option -g prefix2 C-z
bind-key C-b send-prefix
bind-key C-x send-keys C-x
bind-key C-c send-keys C-c
bind-key C-s send-keys C-s

# Various
bind s set-option status off
bind t set-option status on
bind x "refresh-client; run-shell \"notify-send 'Refreshed' 'Successfully Refreshed TMux.'\""

# Windows
bind v split-window -v
bind 2 split-window -v
bind h split-window -h
bind 3 split-window -h
bind t new-window
bind w kill-window

# Panes
bind Right select-pane -R
bind Left select-pane -L
bind Up select-pane -U
bind Down select-pane -D
bind 0 kill-pane

# Tabs
bind Tab next
bind p prev
bind q kill-session
bind z command-prompt
